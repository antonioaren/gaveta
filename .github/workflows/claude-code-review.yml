# Revisión automática de PRs con Claude Code.
# Solo revisa: no hay workflow que responda a menciones @claude.
# Requiere la Claude GitHub App instalada y el secreto CLAUDE_CODE_OAUTH_TOKEN
# (generado con `claude setup-token`).
name: Claude Code Review

on:
  pull_request:
    # Una revisión por PR: al abrirlo o al sacarlo de borrador, no en cada push.
    types: [opened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Solo PRs abiertos por el dueño del repo (forks, Dependabot, etc. se omiten).
    if: github.event.pull_request.user.login == 'antonioaren'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Comprobar secreto
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin CLAUDE_CODE_OAUTH_TOKEN; se omite la revisión."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.enabled == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--max-turns 30 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
