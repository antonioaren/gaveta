# Automatic PR review with Claude Code (code-review plugin only; no @claude workflow).
# Requires the Claude GitHub App and CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
name: Claude Code Review

on:
  pull_request:
    # No `synchronize`: review on open, ready-for-review, and reopen only (lower usage vs installer default).
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check secret
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN not set; skipping review."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.enabled == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow Cloud Agent draft/ready toggles (login is cursor[bot] on GitHub).
          allowed_bots: 'cursor[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Each trigger is deliberate (no synchronize); do not skip re-reviews because of
          # earlier shallow "No issues found" comments from step 1 of the upstream plugin.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Workflow override (required): This is an intentional review run. In step 1 of the code-review command, ignore the rule that stops when Claude has already commented on this PR. Continue with steps 2–9 unless the PR is closed, is a draft, or is a trivial automated change that clearly needs no review.
          # Plugin frontmatter lists gh + inline MCP only; the command body also needs Task
          # (steps 1–5 subagents), TodoWrite (notes), and Read/Grep/Glob (CLAUDE.md + sources).
          claude_args: >-
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Task,Read,Grep,Glob,TodoWrite,Bash(git rev-parse:*)"
